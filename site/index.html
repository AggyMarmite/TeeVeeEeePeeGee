<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: http: data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>TV Guide Matcher</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e8eaf0; --dim: #8b92a3; --accent: #5b9dff; --good: #3ecf8e; --warn: #f5b84a; --bad: #ff6b6b;
    --r: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(15,17,21,.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 12px 14px 10px; padding-top: calc(12px + env(safe-area-inset-top)); }
  h1 { font-size: 18px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  h1 small { font-weight: 400; color: var(--dim); font-size: 13px; margin-left: auto; }
  .link { display: flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 6px 6px 10px; }
  .link code { flex: 1; font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button, .btn { appearance: none; border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; }
  button:disabled { opacity: .45; }
  button.sm { padding: 5px 10px; font-size: 13px; }
  .tools { display: flex; gap: 8px; margin-top: 10px; }
  input[type=search], input[type=password], input[type=text], select { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 9px 11px; font: inherit; font-size: 15px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
  .chip { border-radius: 999px; padding: 5px 11px; font-size: 13px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .chip.on { color: var(--text); border-color: var(--accent); background: rgba(91,157,255,.15); }
  main { padding: 8px 10px; }
  .row { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: var(--r); background: var(--panel); margin-bottom: 6px; border: 1px solid transparent; cursor: pointer; }
  .row.dirty { border-color: rgba(91,157,255,.5); }
  .logo { width: 40px; height: 40px; border-radius: 8px; background: var(--panel2) center/contain no-repeat; flex: none; }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .match { font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .match.ok { color: var(--good); } .match.sug { color: var(--warn); } .match.none { color: var(--dim); } .match.bad { color: var(--bad); }
  .more { display: block; width: 100%; margin: 8px 0 20px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(15,17,21,.96); border-top: 1px solid var(--line); }
  .bar button { flex: 1; padding: 11px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 88vh; background: var(--panel); border-radius: 18px 18px 0 0; display: none; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  .sheet.open, .sheet-bg.open { display: flex; }
  .sheet-head { padding: 14px 14px 8px; border-bottom: 1px solid var(--line); }
  .sheet-head .name { font-size: 16px; white-space: normal; }
  .sheet-body { overflow-y: auto; padding: 8px 12px 16px; }
  .opt { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 10px; background: var(--panel2); margin-bottom: 6px; cursor: pointer; }
  .opt.cur { outline: 2px solid var(--good); }
  .opt .body .name { font-weight: 500; }
  .score { font-size: 12px; color: var(--dim); flex: none; }
  .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 12px 2px 6px; }
  .inline { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .inline select { width: auto; flex: 1; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 10px 0; }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .card p, .card li { color: var(--dim); font-size: 14px; }
  .card ol { padding-left: 20px; margin: 6px 0 10px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom)); background: #262b36; border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px; z-index: 20; font-size: 14px; max-width: 92vw; display: none; }
  .toast.show { display: block; }
  .empty { text-align: center; color: var(--dim); padding: 40px 10px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>TV Guide Matcher <small id="stats"></small></h1>
  <div class="link"><code id="epgUrl"></code><button class="sm" id="copyBtn">Copy</button></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Search your channels…" autocomplete="off">
    <button id="menuBtn" aria-label="Menu">⋯</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="main"></main>

<div class="bar">
  <button id="refreshBtn">↻ Refresh guide</button>
  <button class="primary" id="saveBtn" disabled>Save</button>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head" id="sheetHead"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".m3u,.m3u8,audio/x-mpegurl,application/x-mpegurl,text/plain" hidden>

<script type="module" src="app.js"></script>

</body>
</html>
