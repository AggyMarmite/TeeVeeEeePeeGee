name: Build guide
# Rebuilds nightly, whenever matches/channels change, or on demand (Actions → Run workflow)
#
# Security layout:
#   channels — the only job that sees your playlist secret; runs no third-party code
#   build    — runs the open-source grabber, read-only, no secrets
#   publish  — the only job that can write to the repo/site; runs only first-party GitHub actions

on:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - mappings.json
      - data/channels.json
      - config.json
      - scripts/**
      - site/**
      - .github/workflows/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-guide
  cancel-in-progress: true

jobs:
  channels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HAS_M3U: ${{ secrets.M3U_URL != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Refresh channel list from playlist
        if: env.HAS_M3U == 'true'
        continue-on-error: true
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: node scripts/sync-channels.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: channels
          path: data/channels.json
          retention-days: 1

  build:
    needs: channels
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: channels
          path: data

      - name: Get epgshare01 channel lists
        run: node scripts/epgshare.mjs catalogue

      - name: Get guide grabber
        run: git clone --depth 1 https://github.com/iptv-org/epg.git .epg

      - name: Install grabber
        working-directory: .epg
        run: npm ci --no-audit --no-fund --ignore-scripts && npm run api:load

      - name: Build source catalogue
        run: node scripts/build-sources.mjs .epg

      - name: Auto-match new channels
        run: node scripts/auto-match.mjs

      - name: Make grab list
        run: node scripts/make-grab-list.mjs

      - name: Fetch listings
        working-directory: .epg
        run: |
          if [ "$(cat ../work/count)" = "0" ]; then echo "Nothing to grab"; exit 0; fi
          DAYS=$(node -p "require('../config.json').days || 3")
          CONN=$(node -p "require('../config.json').maxConnections || 8")
          npm run grab --- --channels=../work/channels.xml --output=../work/grabbed.xml --days=$DAYS --maxConnections=$CONN --timeout=30000

      - name: Fetch epgshare01 listings
        run: node scripts/epgshare.mjs listings

      - name: Build guide
        run: node scripts/build-guide.mjs

      - name: Second pass — replace sources with moved-channel notices, foreign or empty listings
        if: hashFiles('work/bad-changed') != ''
        run: |
          node scripts/auto-match.mjs
          node scripts/make-grab-list.mjs
          DAYS=$(node -p "require('./config.json').days || 3")
          CONN=$(node -p "require('./config.json').maxConnections || 8")
          if [ "$(cat work/count)" != "0" ]; then
            (cd .epg && npm run grab --- --channels=../work/channels.xml --output=../work/grabbed.xml --days=$DAYS --maxConnections=$CONN --timeout=30000)
          fi
          node scripts/epgshare.mjs listings
          node scripts/build-guide.mjs

      - name: Audit guide
        continue-on-error: true
        run: node scripts/audit.mjs

      - name: Assemble site
        run: |
          cp site/* out/
          cp config.json mappings.json data/channels.json out/
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data
          retention-days: 1
          path: |
            mappings.json
            data/channels.json
            data/last-build.json
            data/bad-sources.json
            data/audit.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: data
          path: incoming

      - name: Save channel list, matches and build summary
        continue-on-error: true
        run: |
          cp incoming/mappings.json mappings.json
          cp incoming/data/*.json data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channels.json data/last-build.json data/bad-sources.json data/audit.json mappings.json
          if ! git diff --cached --quiet; then
            git commit -m "Nightly update"
            git pull --rebase --autostash || true
            git push
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
